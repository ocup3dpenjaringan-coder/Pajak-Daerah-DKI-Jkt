<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pajak Daerah DKI Jakarta</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-effect {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glass-text { text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- MOCKUP HP -->
  <div class="relative w-[320px] h-[650px] bg-slate-900 rounded-[40px] shadow-2xl border-[8px] border-slate-800 overflow-hidden ring-1 ring-slate-700">
    
    <!-- Background Gambar -->
    <div 
      class="absolute inset-0 bg-cover bg-center z-0"
      style="background-image: url('https://images.unsplash.com/photo-1555899434-94d1368aa7af?q=80&w=600&auto=format&fit=crop')"
    >
      <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <!-- Poni (Notch) HP -->
    <div class="absolute top-0 inset-x-0 h-6 bg-slate-800 rounded-b-xl w-32 mx-auto z-20"></div>
    
    <!-- Area Konten -->
    <div class="absolute inset-0 z-10 overflow-y-auto no-scrollbar pt-12 pb-20 px-6">
      
      <!-- Info Waktu (Real-time) -->
      <div id="clock" class="glass-effect text-white text-[10px] font-medium py-1 px-3 rounded-full mb-6 shadow-sm mx-auto flex justify-center w-fit backdrop-blur-md">
        Memuat waktu...
      </div>

      <!-- Judul -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white glass-text tracking-wide mb-1">
          Menu Utama
        </h1>
      </div>

      <!-- DAFTAR TOMBOL LINK -->
      <div class="flex flex-col gap-4">
        
        <!-- PENTING: Ganti link di dalam href="..." dengan alamat tujuan Anda. Wajib gunakan https:// -->
        
        <!-- Tombol 1: Insentif PBB -->
        <a href="https://bapenda.jakarta.go.id" target="_blank" rel="noopener noreferrer" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-gradient-to-r from-blue-500 to-blue-700 opacity-95 hover:opacity-100 border border-white/20">
          Insentif PBB
        </a>

        <!-- Tombol 2: Insentif BPHTB -->
        <a href="https://bapenda.jakarta.go.id" target="_blank" rel="noopener noreferrer" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-gradient-to-r from-purple-500 to-purple-700 opacity-95 hover:opacity-100 border border-white/20">
          Insentif BPHTB
        </a>

        <!-- Tombol 3: Alur Verifikasi BPHTB -->
        <a href="https://bapenda.jakarta.go.id" target="_blank" rel="noopener noreferrer" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-gradient-to-r from-emerald-500 to-emerald-700 opacity-95 hover:opacity-100 border border-white/20">
          Alur Verifikasi BPHTB
        </a>

      </div>
    </div>

    <!-- Garis Navigasi Bawah -->
    <div class="absolute bottom-2 inset-x-0 h-1 bg-white/40 rounded-full w-24 mx-auto z-20"></div>
  </div>

  <!-- Script untuk Jam Real-time -->
  <script>
    function updateClock() {
      const date = new Date();
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      
      const dayName = days[date.getDay()];
      const day = date.getDate().toString().padStart(2, '0');
      const monthName = months[date.getMonth()];
      const year = date.getFullYear();
      
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      
      document.getElementById('clock').innerText = `${dayName}, ${day}-${monthName}-${year} ${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
