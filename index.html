<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <title>Pajak Daerah DKI Jakarta</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-effect {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-text { text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    /* Animasi ikon musik berputar lambat saat aktif */
    .spin-slow {
      animation: spin 4s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center sm:p-4 font-sans m-0">

  <!-- File Audio Gambang Kromong -->
  <audio id="bgMusic" loop>
    <source src="gambang-kromong.mp3" type="audio/mpeg">
  </audio>

  <div class="relative w-full h-[100dvh] sm:w-[320px] sm:h-[650px] sm:rounded-[40px] sm:shadow-2xl sm:shadow-black sm:border-[8px] sm:border-slate-800 overflow-hidden sm:ring-1 sm:ring-slate-700">
    
    <!-- Background Gambar -->
    <div 
      class="absolute inset-0 bg-cover bg-center z-0"
      style="background-image: url('https://images.unsplash.com/photo-1555899434-94d1368aa7af?q=80&w=600&auto=format&fit=crop')"
    >
      <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Poni (Notch) HP -->
    <div class="hidden sm:block absolute top-0 inset-x-0 h-6 bg-slate-950 rounded-b-xl w-32 mx-auto z-20"></div>
    
    <!-- Tombol Kontrol Musik -->
    <button id="musicToggle" class="absolute top-12 right-4 z-30 p-2.5 glass-effect rounded-full text-white/50 hover:text-white transition" title="Mainkan/Hentikan Musik">
      <svg id="musicIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <!-- Area Konten -->
    <div class="absolute inset-0 z-10 overflow-y-auto no-scrollbar pt-12 pb-20 px-6">
      
      <!-- Info Waktu (Real-time) -->
      <div id="clock" class="glass-effect text-slate-200 text-[20px] font-medium py-2 px-5 rounded-full mb-6 shadow-md mx-auto flex justify-center w-fit backdrop-blur-md">
        Memuat waktu...
      </div>

      <!-- Judul -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white glass-text tracking-wide mb-1">
          Menu Utama
        </h1>
      </div>

      <!-- DAFTAR TOMBOL LINK -->
      <div class="flex flex-col gap-4">
        
        <a href="insentif-pbb.html" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-slate-800/80 hover:bg-blue-600 border border-slate-600 hover:border-blue-400">
          Insentif PBB
        </a>

        <a href="alur-pelayanan-pbb.html" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-slate-800/80 hover:bg-amber-600 border border-slate-600 hover:border-amber-400">
          Alur Pelayanan PBB
        </a>

        <a href="insentif-bphtb.html" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-slate-800/80 hover:bg-purple-600 border border-slate-600 hover:border-purple-400">
          Insentif BPHTB
        </a>

        <a href="alur-bphtb.html" class="block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-slate-800/80 hover:bg-emerald-600 border border-slate-600 hover:border-emerald-400">
          Alur Verifikasi BPHTB
        </a>

      </div>
    </div>

    <!-- Garis Navigasi Bawah -->
    <div class="hidden sm:block absolute bottom-2 inset-x-0 h-1 bg-slate-500 rounded-full w-24 mx-auto z-20"></div>
  </div>

  <!-- Script untuk Jam dan Musik -->
  <script>
    // --- Logika Jam Real-time ---
    function updateClock() {
      const date = new Date();
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const dayName = days[date.getDay()];
      const day = date.getDate().toString().padStart(2, '0');
      const monthName = months[date.getMonth()];
      const year = date.getFullYear();
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      
      const clockElement = document.getElementById('clock');
      if (clockElement) {
        clockElement.innerText = `${dayName}, ${day}-${monthName}-${year} ${hours}:${minutes}`;
      }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Logika Musik Latar ---
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');
    let isPlaying = false;

    function updateIcon(playing) {
      if (playing) {
        musicToggle.classList.add('text-white');
        musicToggle.classList.remove('text-white/50');
        musicIcon.classList.add('spin-slow');
      } else {
        musicToggle.classList.remove('text-white');
        musicToggle.classList.add('text-white/50');
        musicIcon.classList.remove('spin-slow');
      }
    }

    function playMusic() {
      bgMusic.play().then(() => {
        isPlaying = true;
        updateIcon(true);
      }).catch(err => console.log("Autoplay diblokir:", err));
    }

    function pauseMusic() {
      bgMusic.pause();
      isPlaying = false;
      updateIcon(false);
    }

    window.addEventListener('DOMContentLoaded', () => {
      playMusic();
    });

    document.body.addEventListener('click', function initAudio() {
      if (!isPlaying) {
        playMusic();
      }
      document.body.removeEventListener('click', initAudio);
    }, { once: true });

    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isPlaying) {
        pauseMusic();
      } else {
        playMusic();
      }
    });
  </script>

</body>
</html>
