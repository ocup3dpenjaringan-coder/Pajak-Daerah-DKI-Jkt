<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>Pajak Daerah DKI Jakarta</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.12); }
    .glass-strong { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
    .spin-slow { animation: spin 4s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .sortable-ghost { opacity: 0.35; transform: scale(0.96); }
    .btn-item { touch-action: manipulation; user-select: none; }
    
    /* Animasi pudar untuk layar pembuka */
    .fade-out { animation: fadeOut 0.5s ease forwards; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center sm:p-4 font-sans m-0 overflow-hidden">

  <!-- File Audio Gambang Kromong -->
  <audio id="bgMusic" loop preload="auto">
    <source src="gambang-kromong.mp3" type="audio/mpeg">
  </audio>

  <div class="relative w-full h-[100dvh] sm:w-[330px] sm:h-[670px] sm:rounded-[40px] sm:shadow-2xl sm:border-[8px] sm:border-slate-800 overflow-hidden">
    
    <!-- Background -->
    <div class="absolute inset-0 bg-cover bg-center z-0" style="background-image: url('https://images.unsplash.com/photo-1555899434-94d1368aa7af?q=80&w=600&auto=format&fit=crop')">
      <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Notch HP -->
    <div class="hidden sm:block absolute top-0 inset-x-0 h-6 bg-slate-950 rounded-b-xl w-32 mx-auto z-20"></div>

    <!-- LAYAR PEMBUKA (Wajib diklik agar musik bisa jalan) -->
    <div id="startScreen" class="absolute inset-0 z-50 glass-strong flex flex-col items-center justify-center cursor-pointer transition-all">
      <div class="glass p-8 rounded-3xl text-center shadow-2xl animate-pulse border border-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 mx-auto text-blue-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672ZM12 2.25V4.5m5.834.166-1.591 1.591M20.25 10.5H18M7.757 14.743l-1.59 1.59M6 10.5H3.75m4.007-4.243-1.59-1.59" />
        </svg>
        <h2 class="text-white text-2xl font-bold mb-2 tracking-wide">Pajak Daerah</h2>
        <p class="text-slate-300 text-sm">Ketuk layar untuk memulai</p>
      </div>
    </div>
    
    <!-- Tombol Kontrol Musik -->
    <button id="musicToggle" class="absolute top-9 right-4 z-30 p-2 glass rounded-full text-white/50 hover:text-white transition" title="Musik">
      <svg id="musicIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>

    <!-- Area Konten Utama -->
    <div class="absolute inset-0 z-10 overflow-y-auto no-scrollbar pt-9 pb-10 px-5">
      
      <!-- Jam -->
      <div id="clock" class="glass text-slate-200 text-[18px] font-medium py-1.5 px-4 rounded-full mb-4 shadow-md mx-auto w-fit text-center leading-snug">
        Memuat waktu...
      </div>

      <div class="text-center mb-5">
        <h1 class="text-2xl font-bold text-white drop-shadow tracking-wide mb-0.5">Pelayanan UP3D</h1>
        <p class="text-[11px] text-slate-300/80">Tahan &amp; geser tombol untuk mengatur urutan</p>
      </div>

      <!-- Tombol Link -->
      <div id="sortable-buttons" class="flex flex-col gap-3">
        <a data-id="b1" href="insentif-pbb.html" class="btn-item flex items-center justify-between w-full py-3.5 px-5 rounded-full text-sm text-white font-semibold shadow-lg glass bg-slate-800/80 hover:bg-blue-600 border border-slate-600">
          <span class="w-4"></span><span class="flex-1 text-center">Insentif PBB</span><span class="text-slate-400">⋮⋮</span>
        </a>
        <a data-id="b2" href="insentif-bphtb.html" class="btn-item flex items-center justify-between w-full py-3.5 px-5 rounded-full text-sm text-white font-semibold shadow-lg glass bg-slate-800/80 hover:bg-purple-600 border border-slate-600">
          <span class="w-4"></span><span class="flex-1 text-center">Insentif BPHTB</span><span class="text-slate-400">⋮⋮</span>
        </a>
        <a data-id="b3" href="alur-pelayanan-pbb.html" class="btn-item flex items-center justify-between w-full py-3.5 px-5 rounded-full text-sm text-white font-semibold shadow-lg glass bg-slate-800/80 hover:bg-amber-600 border border-slate-600">
          <span class="w-4"></span><span class="flex-1 text-center">Alur Pelayanan PBB</span><span class="text-slate-400">⋮⋮</span>
        </a>
        <a data-id="b4" href="alur-bphtb.html" class="btn-item flex items-center justify-between w-full py-3.5 px-5 rounded-full text-sm text-white font-semibold shadow-lg glass bg-slate-800/80 hover:bg-emerald-600 border border-slate-600">
          <span class="w-4"></span><span class="flex-1 text-center">Alur Verifikasi BPHTB</span><span class="text-slate-400">⋮⋮</span>
        </a>
        <a data-id="b5" href="https://pajak-daerah.github.io/Form_Jkt/" target="_blank" rel="noopener noreferrer" class="btn-item flex items-center justify-between w-full py-3.5 px-5 rounded-full text-sm text-white font-semibold shadow-lg glass bg-slate-800/80 hover:bg-cyan-600 border border-slate-600">
          <span class="w-4"></span><span class="flex-1 text-center">Formulir Pelayanan Pajak</span><span class="text-slate-400">⋮⋮</span>
        </a>
      </div>
    </div>

    <!-- Garis Bawah HP -->
    <div class="hidden sm:block absolute bottom-2 inset-x-0 h-1 bg-slate-500 rounded-full w-24 mx-auto z-20"></div>
  </div>

  <script>
    // 1. Logika Jam Real-time
    function updateClock() {
      const d = new Date();
      const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()];
      const bln = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()];
      const tgl = String(d.getDate()).padStart(2,'0');
      const jam = String(d.getHours()).padStart(2,'0');
      const mnt = String(d.getMinutes()).padStart(2,'0');
      
      const clockEl = document.getElementById('clock');
      if(clockEl) clockEl.innerText = `${hari}, ${tgl}-${bln}-${d.getFullYear()} ${jam}:${mnt}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 2. Logika Musik & Layar Pembuka
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicIcon = document.getElementById('musicIcon');
    const startScreen = document.getElementById('startScreen');
    let isPlaying = false;

    function toggleAudioState(play) {
      isPlaying = play;
      musicToggle.classList.toggle('text-white', play);
      musicToggle.classList.toggle('text-white/50', !play);
      musicIcon.classList.toggle('spin-slow', play);
    }

    function playMusic() {
      bgMusic.play().then(() => {
        toggleAudioState(true);
      }).catch(err => console.log("Audio diblokir browser:", err));
    }

    // Saat layar pembuka diketuk
    startScreen.addEventListener('click', () => {
      startScreen.classList.add('fade-out'); // Hilangkan layar pembuka
      playMusic(); // Mainkan musik
    });

    // Tombol on/off musik di pojok kanan atas
    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isPlaying) {
        bgMusic.pause();
        toggleAudioState(false);
      } else {
        playMusic();
      }
    });

    // 3. Logika Drag & Drop Urutan Tombol
    const container = document.getElementById('sortable-buttons');
    const KEY = 'pajak_dki_order_v5';
    let dragging = false;

    // Load urutan tersimpan
    JSON.parse(localStorage.getItem(KEY) || '[]').forEach(id => {
      const el = container.querySelector(`[data-id="${id}"]`);
      if (el) container.appendChild(el);
    });

    // Inisialisasi SortableJS
    Sortable.create(container, {
      animation: 200, 
      delay: 150, 
      delayOnTouchOnly: true, 
      ghostClass: 'sortable-ghost',
      onStart: () => { dragging = true; },
      onEnd: () => {
        localStorage.setItem(KEY, JSON.stringify([...container.children].map(el => el.dataset.id)));
        setTimeout(() => { dragging = false; }, 100);
      }
    });

    // Mencegah klik tombol tak sengaja saat sedang menggeser
    container.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', e => { if (dragging) e.preventDefault(); });
    });
  </script>
</body>
</html>
