<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Link Layar HP</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel untuk menerjemahkan JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Menyembunyikan scrollbar tapi tetap bisa di-scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .glass-text {
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- Tempat React akan di-render -->
  <div id="root"></div>

  <!-- Script Firebase (Menggunakan versi Modular terbaru v10+) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // KARENA INI FILE HTML LOKAL, KITA HARUS MENGGUNAKAN KONFIGURASI FIREBASE ANDA SENDIRI DI SINI
    // PENTING: Ganti konfigurasi di bawah ini dengan milik Anda dari Firebase Console
    const firebaseConfig = {
      apiKey: "API_KEY_ANDA",
      authDomain: "PROJECT_ID_ANDA.firebaseapp.com",
      projectId: "PROJECT_ID_ANDA",
      storageBucket: "PROJECT_ID_ANDA.appspot.com",
      messagingSenderId: "SENDER_ID_ANDA",
      appId: "APP_ID_ANDA"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Mengekspos fungsi Firebase ke window agar bisa diakses oleh React (Babel)
    window.firebaseDb = db;
    window.firebaseFunctions = {
      collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc
    };
  </script>

  <!-- Script React Aplikasi -->
  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Icon Components (Menggunakan SVG langsung karena Lucide React tidak via CDN dengan mudah)
    const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>;
    const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
    const SettingsIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>;

    // Palet Warna
    const colorPalette = [
      "from-blue-400 to-blue-600",
      "from-purple-400 to-purple-600",
      "from-emerald-400 to-emerald-600",
      "from-rose-400 to-rose-600",
      "from-amber-400 to-amber-600",
      "from-cyan-400 to-cyan-600",
      "from-fuchsia-400 to-fuchsia-600",
      "from-teal-400 to-teal-600"
    ];

    function App() {
      // Tunggu sampai objek Firebase siap (karena diload via module script)
      const [isFirebaseReady, setIsFirebaseReady] = useState(false);
      
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [password, setPassword] = useState("");
      
      const [links, setLinks] = useState([]);
      
      // State untuk Form Link
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({ title: "", url: "" });
      
      // State untuk Header Text
      const [headerText, setHeaderText] = useState({ title: "Menu Utama", subtitle: "" });
      const [showHeaderForm, setShowHeaderForm] = useState(false);
      const [headerFormData, setHeaderFormData] = useState({ title: "", subtitle: "" });
      
      // State untuk Waktu
      const [currentTime, setCurrentTime] = useState(new Date());

      // Cek ketersediaan Firebase
      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.firebaseDb && window.firebaseFunctions) {
            setIsFirebaseReady(true);
            clearInterval(checkFirebase);
          }
        }, 100);
        return () => clearInterval(checkFirebase);
      }, []);

      // Jam Real-time
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Format Waktu
      const formatDateTime = (date) => {
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        
        const dayName = days[date.getDay()];
        const day = date.getDate().toString().padStart(2, '0');
        const monthName = months[date.getMonth()];
        const year = date.getFullYear();
        
        const hours = date.getHours().toString().padStart(2, '0');
        const minutes = date.getMinutes().toString().padStart(2, '0');
        
        return `${dayName}, ${day}-${monthName}-${year} ${hours}:${minutes}`;
      };

      // Load Data dari Firebase (Hanya jalan setelah Firebase siap)
      useEffect(() => {
        if (!isFirebaseReady) return;

        const { collection, onSnapshot, doc } = window.firebaseFunctions;
        const db = window.firebaseDb;

        // Listener untuk Links
        const unsubscribeLinks = onSnapshot(collection(db, "app_links"), (snapshot) => {
          const loadedLinks = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          
          loadedLinks.sort((a, b) => a.order - b.order);
          setLinks(loadedLinks);
        });

        // Listener untuk Header
        const unsubscribeHeader = onSnapshot(doc(db, "app_settings", "header"), (docSnap) => {
          if (docSnap.exists()) {
            setHeaderText(docSnap.data());
          }
        });

        return () => {
          unsubscribeLinks();
          unsubscribeHeader();
        };
      }, [isFirebaseReady]);

      // --- Fitur Login ---
      const handleLogin = (e) => {
        e.preventDefault();
        if (password === "rumah123#") {
          setIsAdmin(true);
          setShowLogin(false);
          setPassword("");
        } else {
          alert("Sandi salah!");
        }
      };

      // --- Fitur Header ---
      const openHeaderForm = () => {
        setHeaderFormData({
          title: headerText.title || "",
          subtitle: headerText.subtitle || ""
        });
        setShowHeaderForm(true);
      };

      const saveHeader = async (e) => {
        e.preventDefault();
        if (!isFirebaseReady) {
            alert("Database belum siap atau konfigurasi belum diisi.");
            return;
        }
        try {
          const { doc, setDoc } = window.firebaseFunctions;
          const db = window.firebaseDb;
          await setDoc(doc(db, "app_settings", "header"), headerFormData);
          setShowHeaderForm(false);
        } catch (error) {
          console.error("Error saving header:", error);
          alert("Gagal menyimpan. Pastikan konfigurasi Firebase sudah benar.");
        }
      };

      // --- Fitur Links ---
      const openAddForm = () => {
        setFormData({ title: "", url: "" });
        setEditingId(null);
        setShowForm(true);
      };

      const openEditForm = (link) => {
        setFormData({ title: link.title, url: link.url });
        setEditingId(link.id);
        setShowForm(true);
      };

      const saveLink = async (e) => {
        e.preventDefault();
         if (!isFirebaseReady) {
            alert("Database belum siap atau konfigurasi belum diisi.");
            return;
        }

        try {
          const { collection, addDoc, updateDoc, doc } = window.firebaseFunctions;
          const db = window.firebaseDb;

          if (editingId) {
            await updateDoc(doc(db, "app_links", editingId), {
              title: formData.title,
              url: formData.url
            });
          } else {
            // Ambil warna unik berdasarkan jumlah link
            const nextColorIndex = links.length % colorPalette.length;
            const linkColor = colorPalette[nextColorIndex];

            await addDoc(collection(db, "app_links"), {
              title: formData.title,
              url: formData.url,
              colorClass: linkColor,
              order: Date.now()
            });
          }
          setShowForm(false);
        } catch (error) {
          console.error("Error saving link:", error);
          alert("Gagal menyimpan. Pastikan konfigurasi Firebase sudah benar.");
        }
      };

      const deleteLink = async (id) => {
        if (!isFirebaseReady) return;
        if (confirm("Hapus link ini?")) {
          try {
            const { deleteDoc, doc } = window.firebaseFunctions;
            const db = window.firebaseDb;
            await deleteDoc(doc(db, "app_links", id));
          } catch (error) {
             console.error("Error deleting link:", error);
          }
        }
      };

      // Mencegah klik link saat mode admin
      const handleLinkClick = (e, url) => {
        if (isAdmin) {
          e.preventDefault(); // Jangan buka link kalau admin
        }
      };

      return (
        <div className="flex flex-col items-center">
          
          {/* Tombol Login/Logout di luar HP */}
          <div className="w-full max-w-sm mb-4 flex justify-end">
            {!isAdmin ? (
              <button 
                onClick={() => setShowLogin(true)}
                className="text-xs bg-slate-800 text-white px-3 py-1 rounded shadow"
              >
                Login Admin
              </button>
            ) : (
              <button 
                onClick={() => setIsAdmin(false)}
                className="text-xs bg-red-600 text-white px-3 py-1 rounded shadow"
              >
                Keluar Admin
              </button>
            )}
          </div>

          {/* Modal Login */}
          {showLogin && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
              <div className="bg-white p-6 rounded-xl shadow-xl max-w-xs w-full">
                <h3 className="font-bold text-lg mb-4 text-slate-800">Masuk Mode Admin</h3>
                <form onSubmit={handleLogin}>
                  <input 
                    type="password"
                    placeholder="Kata Sandi (rumah123#)"
                    className="w-full border rounded p-2 mb-4"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setShowLogin(false)} className="px-4 py-2 text-slate-500">Batal</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded">Masuk</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MOCKUP HP */}
          <div className="relative w-[320px] h-[650px] bg-slate-900 rounded-[40px] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] border-[8px] border-slate-800 overflow-hidden ring-1 ring-slate-700">
            
            {/* Background Gambar Monas */}
            <div 
              className="absolute inset-0 bg-cover bg-center z-0"
              style={{ backgroundImage: "url('https://images.unsplash.com/photo-1555899434-94d1368aa7af?q=80&w=600&auto=format&fit=crop')" }}
            >
              {/* Overlay gelap agar teks tetap terbaca */}
              <div className="absolute inset-0 bg-black/30"></div>
            </div>

            {/* Poni (Notch) */}
            <div className="absolute top-0 inset-x-0 h-6 bg-slate-800 rounded-b-xl w-32 mx-auto z-20"></div>
            
            {/* Konten Layar (Scrollable) */}
            <div className="absolute inset-0 z-10 overflow-y-auto no-scrollbar pt-12 pb-20 px-6">
              
              {/* Info Waktu Glassmorphism */}
              <div className="glass-effect text-white text-[10px] font-medium py-1 px-3 rounded-full inline-block mb-6 shadow-sm mx-auto flex justify-center w-fit backdrop-blur-md">
                {formatDateTime(currentTime)}
              </div>

              {/* Judul & Header Aplikasi */}
              <div className="text-center mb-8 relative group">
                {headerText.title && (
                  <h1 className="text-3xl font-bold text-white glass-text tracking-wide mb-1">
                    {headerText.title}
                  </h1>
                )}
                
                {headerText.subtitle && (
                  <p className="text-sm text-slate-200 font-medium glass-text">
                    {headerText.subtitle}
                  </p>
                )}

                {/* Tombol Edit Header (Hanya Admin) */}
                {isAdmin && (
                  <button 
                    onClick={openHeaderForm}
                    className="absolute -right-2 top-0 p-1.5 bg-white/20 hover:bg-white/40 backdrop-blur-sm text-white rounded-full transition"
                    title="Edit Judul"
                  >
                    <SettingsIcon />
                  </button>
                )}
              </div>

              {/* Daftar Tombol Link */}
              <div className="flex flex-col gap-4">
                {links.length === 0 && !isAdmin ? (
                  <div className="text-center text-white/70 text-sm mt-10 glass-effect p-4 rounded-xl">
                    Belum ada link yang ditambahkan.
                  </div>
                ) : (
                  links.map((link) => (
                    <div key={link.id} className="relative group">
                      <a 
                        href={link.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        onClick={(e) => handleLinkClick(e, link.url)}
                        className={`block w-full py-4 px-6 rounded-full text-center text-white font-semibold shadow-lg transition-transform transform active:scale-95 glass-effect bg-gradient-to-r ${link.colorClass || 'from-slate-500 to-slate-600'} opacity-90 hover:opacity-100 border border-white/20`}
                      >
                        {link.title}
                      </a>

                      {/* Kontrol Edit & Hapus (Hanya Admin) */}
                      {isAdmin && (
                        <div className="absolute -right-2 -top-2 flex gap-1 bg-slate-800 p-1 rounded-lg shadow-xl opacity-100 z-20 border border-slate-700">
                          <button 
                            onClick={() => openEditForm(link)}
                            className="p-1.5 text-blue-400 hover:bg-slate-700 rounded"
                            title="Edit"
                          >
                            <EditIcon />
                          </button>
                          <button 
                            onClick={() => deleteLink(link.id)}
                            className="p-1.5 text-red-400 hover:bg-slate-700 rounded"
                            title="Hapus"
                          >
                            <TrashIcon />
                          </button>
                        </div>
                      )}
                    </div>
                  ))
                )}

                {/* Tombol Tambah (Hanya Admin) */}
                {isAdmin && (
                  <button 
                    onClick={openAddForm}
                    className="w-full py-3 mt-2 rounded-full border-2 border-dashed border-white/50 text-white/80 font-medium hover:bg-white/10 hover:text-white transition flex items-center justify-center gap-2 backdrop-blur-sm"
                  >
                    <span>+ Tambah Link Baru</span>
                  </button>
                )}
              </div>
            </div>

            {/* Garis Navigasi Bawah */}
            <div className="absolute bottom-2 inset-x-0 h-1 bg-white/40 rounded-full w-24 mx-auto z-20"></div>
          </div>

          {/* Modal Form Tambah/Edit Link */}
          {showForm && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 text-white p-6 rounded-2xl shadow-2xl max-w-sm w-full border border-slate-700">
                <h3 className="font-bold text-xl mb-4">
                  {editingId ? "Edit Link" : "Tambah Link Baru"}
                </h3>
                <form onSubmit={saveLink}>
                  <div className="mb-4">
                    <label className="block text-sm mb-1 text-slate-300">Nama Tombol</label>
                    <input 
                      type="text"
                      className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"
                      value={formData.title}
                      onChange={(e) => setFormData({...formData, title: e.target.value})}
                      required
                      placeholder="Contoh: Website Perusahaan"
                    />
                  </div>
                  <div className="mb-6">
                    <label className="block text-sm mb-1 text-slate-300">Alamat URL / Link</label>
                    <input 
                      type="url"
                      className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"
                      value={formData.url}
                      onChange={(e) => setFormData({...formData, url: e.target.value})}
                      required
                      placeholder="https://..."
                    />
                  </div>
                  <div className="flex justify-end gap-3">
                    <button 
                      type="button" 
                      onClick={() => setShowForm(false)} 
                      className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition font-medium shadow-lg"
                    >
                      Simpan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Form Edit Header */}
          {showHeaderForm && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 text-white p-6 rounded-2xl shadow-2xl max-w-sm w-full border border-slate-700">
                <h3 className="font-bold text-xl mb-4 text-white">Edit Judul Halaman</h3>
                <form onSubmit={saveHeader}>
                  <div className="mb-4">
                    <label className="block text-sm mb-1 text-slate-300">Judul Utama (Kosongkan jika ingin dihapus)</label>
                    <input 
                      type="text"
                      className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"
                      value={headerFormData.title}
                      onChange={(e) => setHeaderFormData({...headerFormData, title: e.target.value})}
                      placeholder="Contoh: Menu Utama"
                    />
                  </div>
                  <div className="mb-6">
                    <label className="block text-sm mb-1 text-slate-300">Subjudul Teks Tambahan</label>
                    <input 
                      type="text"
                      className="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:border-blue-500 focus:outline-none"
                      value={headerFormData.subtitle}
                      onChange={(e) => setHeaderFormData({...headerFormData, subtitle: e.target.value})}
                      placeholder="Contoh: Pilih link di bawah ini"
                    />
                  </div>
                  <div className="flex justify-end gap-3">
                    <button 
                      type="button" 
                      onClick={() => setShowHeaderForm(false)} 
                      className="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition font-medium shadow-lg"
                    >
                      Simpan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
